# Markdown Lint – keeps portfolio docs clean and consistent
name: Markdown Lint

on:
  push:
    branches: [main, master]
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.md'

jobs:
  lint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: |
          markdownlint "**/*.md" \
            --ignore node_modules \
            --ignore .git \
            --disable MD013 MD033 MD041 || true
        # MD013 = line length (often noisy for docs)
        # MD033 = inline HTML (sometimes used in README badges)
        # MD041 = first line heading (README flexibility)
        # Remove "|| true" if you want the job to fail on lint errors
