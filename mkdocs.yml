# MkDocs – Healthcare BA & AI Portfolio
# https://www.mkdocs.org/user-guide/configuration/

site_name: Healthcare BA & AI Portfolio
site_description: Business Analysis and AI Product portfolio case studies in Healthcare & Life Sciences
site_author: Tej Singh

# After first successful Pages deploy, set this to your real URL:
# site_url: https://tsrajpurohit.github.io/healthcare-ba-ai-portfolio-/

repo_name: tsrajpurohit/healthcare-ba-ai-portfolio-
repo_url: https://github.com/tsrajpurohit/healthcare-ba-ai-portfolio-
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  # Optional: add files under docs/assets/
  # logo: assets/logo.png
  # favicon: assets/favicon.ico

  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.indexes   # optional: section Overview as tab landing page
    - navigation.tabs          # top bar sections
    - navigation.tabs.sticky   # tabs stay visible on scroll
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      tip: fontawesome/solid/lightbulb

plugins:
  - search
  - mermaid2
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - glightbox
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - redirects:
      redirect_maps:
        #old-page.md: new-page.md
  - awesome-pages
  - print-site

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tsrajpurohit/healthcare-ba-ai-portfolio-
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/tej-singh-rajpurohit-39071694/
  generator: false   # hide "Made with Material for MkDocs"

extra_css:
  - stylesheets/extra.css

